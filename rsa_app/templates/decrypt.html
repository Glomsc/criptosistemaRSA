<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Decifrar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col items-center py-16">
  <div class="w-full max-w-lg bg-white p-8 rounded-lg shadow-lg">
    <h2 class="text-2xl font-semibold mb-6 text-gray-800">Decifrar Texto</h2>
    <form id="formDecifrar" class="space-y-4">
      <div>
        <label class="block mb-1 font-medium text-gray-700">Texto cifrado:</label>
        <textarea id="texto_criptografado" rows="3" class="w-full p-2 border rounded-md"></textarea>
      </div>
      <div>
        <label class="block mb-1 font-medium text-gray-700">Chave privada d:</label>
        <input type="number" id="d" required class="w-full p-2 border rounded-md">
      </div>
      <div>
        <label class="block mb-1 font-medium text-gray-700">Módulo n:</label>
        <input type="number" id="n" required class="w-full p-2 border rounded-md">
      </div>
      <button type="submit" class="w-full py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition">Decifrar</button>
    </form>

    <div id="resultado" class="mt-6 space-y-2"></div>
    <a href="/" class="mt-4 inline-block text-blue-600 hover:underline"> Retornar ao Menu</a>
  </div>

  <script>
    document.getElementById('formDecifrar').addEventListener('submit', async (e) => {
      e.preventDefault();
      const texto_criptografado = document.getElementById('texto_criptografado').value;
      const d = document.getElementById('d').value;
      const n = document.getElementById('n').value;

      const resposta = await fetch('/api/dcrypt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texto_criptografado, d, n })
      });

      const dados = await resposta.json();
      const resultado = document.getElementById('resultado');
      resultado.innerHTML = '';

      if (dados.erro) {
        resultado.innerHTML = `<p class="text-red-600 font-semibold">Erro: ${dados.erro}</p>`;
        return;
      }

      resultado.innerHTML = `
        <div class="bg-white p-2 rounded-md border shadow-sm">
          <span class="font-semibold text-gray-700">Texto decifrado:</span>
          <span class="ml-2 text-gray-900 break-words">${dados.texto_decifrado}</span>
        </div>
      `;
    });
  </script>
</body>
</html>
